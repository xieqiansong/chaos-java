spring:
  kafka:
    # 测试用 @EmbeddedKafka 自动注入覆盖，此配置仅用于 app 启动连真实 broker 场景
    bootstrap-servers: localhost:9092
    listener:
      # SimpleConsumer 等需要手动 ack
      ack-mode: manual_immediate
    producer:
      # 消息 key/value 均用 StringSerializer；复杂对象推荐 JSON
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 幂等性：确保单分区内精确一次 + 有序（Transaction 场景需要）
      properties:
        enable.idempotence: true
        # acks=all 搭配 min.insync.replicas（集群场景），单节点学习无影响
        acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 从最早开始消费（demo 场景方便观察，生产环境一般用 latest）
      auto-offset-reset: earliest
      # 禁自动提交：consumer.commitSync() 由各场景自行控制，便于观察语义
      enable-auto-commit: false
      group-id: demo-default-group
    # 开启事务（Transaction 场景需要）
    # 注意：transaction-id-prefix 只在 transactionalKafkaTemplate bean 中配置，
    # 不设置全局 prefix，避免普通 producer（simple/batch/filter 等）也变成事务化。

# 场景自有 topic 由 KafkaAdmin 在 @Configuration 中自动创建，
# 无需手动 kafka-topics.sh，确保开箱即跑。
