# 测试环境统一关闭 Nacos（含 Config 与 Discovery），离线跑单测无需真实 Nacos。
# spring.cloud.config.enabled=false 同时关掉 spring-cloud-commons 的 ConfigDataMissingEnvironmentPostProcessor
# 校验（否则未配置 spring.config.import 会抛 “No spring.config.import set”）。
spring:
  cloud:
    config:
      enabled: false
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
