spring:
  application:
    name: ms-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: ms-user-route
          uri: lb://ms-user
          predicates:
            - Path=/users/**
        - id: ms-order-route
          uri: lb://ms-order
          predicates:
            - Path=/orders/**
        - id: ms-auth-route
          uri: lb://ms-auth
          predicates:
            - Path=/auth/**
    sentinel:
      enabled: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: 8719
  config:
    import: classpath:application-common.yml

server:
  port: 8080

ms:
  security:
    # 与鉴权服务共享同一密钥（否则验签失败）；生产走配置中心/环境变量
    jwt:
      secret: ${JWT_SECRET:chaos-demo-secret-key-please-replace-32-bytes}
