transport {
  type       = "TCP"
  server     = "NIO"
  heartbeat  = "on"
  serialization              = "seata"
  compressor                = "none"
  enableClientBatchSendRequest = "true"
}

service {
  # 事务分组 -> TC 集群 的映射。vgroup 名必须与各微服务的 seata.tx-service-group 一致。
  # Seata Server 侧 file.conf 也用同一个分组名，客户端据此找到 TC 地址（default.grouplist）。
  vgroupMapping.my_test_tx_group = "default"
  # 应用侧（跑在宿主机）连接 Seata Server 的地址；docker-compose 已把 8091 映射到宿主机。
  default.grouplist = "localhost:8091"
  enableDegrade             = false
  disableGlobalTransaction = false
}

client {
  rm {
    asyncCommitBufferLimit = 10000
    lock {
      retryInterval               = 10
      retryTimes                  = 30
      retryPolicyBranchRollbackOnConflict = true
    }
    reportRetryCount   = 5
    tableMetaCheckEnable = false
    reportSuccessEnable  = false
  }
  tm {
    commitRetryCount  = 5
    rollbackRetryCount = 5
  }
  undo {
    # 回滚镜像存放的表名，两个参与库（PG / MySQL）都要建 undo_log
    logSaveDays    = 7
    logDeletePeriod = 86400000
  }
  log {
    exceptionRate = 100
  }
}
