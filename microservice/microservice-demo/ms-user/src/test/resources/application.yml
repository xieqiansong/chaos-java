# 测试专用配置：用 H2 内存库替代真实 PG/MySQL，并关闭 Nacos 注册，使测试离线可跑。
# 多数据源结构（pg / mysql 两个命名库）与线上一致，验证 @DS 路由逻辑。
spring:
  cloud:
    # 关掉 spring-cloud-config 客户端，跳过 spring-cloud-commons 对 spring.config.import 的硬性校验
    # （P6 用的是 Nacos Config，不是 spring-cloud-config server；测试离线跑无需该校验）
    config:
      enabled: false
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
  datasource:
    dynamic:
      primary: pg
      strict: false
      # 测试环境不需要 Seata TC，关掉数据源代理，避免离线连不到 localhost:8091
      seata: false
      datasource:
        pg:
          url: jdbc:h2:mem:pg;DB_CLOSE_DELAY=-1
          username: sa
          password:
          driver-class-name: org.h2.Driver
        mysql:
          url: jdbc:h2:mem:mysql;DB_CLOSE_DELAY=-1
          username: sa
          password:
          driver-class-name: org.h2.Driver

# 测试专用：禁用 Seata 自动配置（不连 TC），只验证多数据源路由等业务逻辑
seata:
  enabled: false
