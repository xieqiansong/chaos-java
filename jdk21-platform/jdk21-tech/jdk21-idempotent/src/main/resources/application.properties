spring.application.name=idempotent-demo
# H2 内存库：零外部依赖开箱即跑
spring.datasource.url=jdbc:h2:mem:idempotent;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
logging.level.lan.chaos.idempotent=INFO
