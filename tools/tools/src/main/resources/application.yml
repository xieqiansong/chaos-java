server:
  port: 8081

spring:
  profiles:
    active: local
  application:
    name: chaos-tools

  # ======== 多数据源（PostgreSQL 主 / MySQL 副） ========
  # 地址与库名请按本地实际填写，也可用环境变量覆盖（PG_URL / MYSQL_URL ...）。
  # 非 Spring 容器场景由 lan.chaos.scratch.YamlConfig 直接读取，例如：
  #   YamlConfig.get("spring.datasource.dynamic.datasource.mysql.url")
  # 若接入 baomidou dynamic-datasource，则用 @DS("mysql") 切到第二数据源。
  datasource:
    dynamic:
      primary: pg
      datasource:
        pg:
          url: ${PG_URL:jdbc:postgresql://localhost:30101/chaos}
          username: ${PG_USER:postgres}
          password: ${PG_PASSWORD:postgres123}
          driver-class-name: org.postgresql.Driver
        mysql:
          url: ${MYSQL_URL:jdbc:mysql://localhost:30100/confusion?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
          username: ${MYSQL_USER:root}
          password: ${MYSQL_PASSWORD:mysql123}
          driver-class-name: com.mysql.cj.jdbc.Driver

  # ======== Redis 配置 ========
  redis:
    host: localhost
    port: 30102
    password: ${REDIS_PASSWORD:redis123}
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 32
        max-idle: 16
        min-idle: 8
