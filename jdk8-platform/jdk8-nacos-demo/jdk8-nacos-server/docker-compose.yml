services:
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: nacos-standalone
    environment:
      - MODE=standalone            # 单机模式（学习用）
      - PREFER_HOST_MODE=hostname
      - JVM_XMS=256m               # 学习机可调小，默认 2g
      - JVM_XMX=256m
      - JVM_XMN=128m
      # 如需外置 MySQL，取消下面注释并填连接信息（同时参考 conf/application.properties.example）
      # - SPRING_DATASOURCE_PLATFORM=mysql
      # - MYSQL_SERVICE_HOST=127.0.0.1
      # - MYSQL_SERVICE_PORT=3306
      # - MYSQL_SERVICE_DB_NAME=nacos
      # - MYSQL_SERVICE_USER=nacos
      # - MYSQL_SERVICE_PASSWORD=nacos
    ports:
      - "8848:8848"   # HTTP 控制台 / 配置 / 注册发现
      - "9848:9848"   # gRPC 客户端 -> 服务端（2.x 必需）
      - "9849:9849"   # gRPC 服务端 -> 服务端（2.x 必需）
    volumes:
      - ./data:/home/nacos/data
      - ./logs:/home/nacos/logs
      # 如需自定义配置，取消下面两行并把 conf/application.properties.example 复制为 application.properties
      # - ./conf/application.properties:/home/nacos/conf/application.properties:ro
      # - ./conf/cluster.conf:/home/nacos/conf/cluster.conf:ro
    restart: unless-stopped
