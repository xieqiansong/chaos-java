version: "3.8"

services:
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: sentinel-dashboard
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SENTINEL_DASHBOARD_USERNAME=sentinel
      - SENTINEL_DASHBOARD_PASSWORD=sentinel
    restart: unless-stopped
