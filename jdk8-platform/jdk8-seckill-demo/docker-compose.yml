version: "3.8"

# 端口与密码严格对齐 application.yml：
#   PostgreSQL  -> 30101 / postgres / REDACTED / demo_seckill
#   Redis       -> 30102 / REDACTED
#   Kafka       -> 30103
# 启动后直接在 IDE 运行 SeckillApplication，或：mvn -pl jdk8-seckill-demo -am spring-boot:run

services:
  postgres:
    image: postgres:14-alpine
    container_name: seckill-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REDACTED
      POSTGRES_DB: demo_seckill
    ports:
      - "30101:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: seckill-redis
    command: ["redis-server", "--requirepass", "REDACTED"]
    ports:
      - "30102:6379"

  kafka:
    image: bitnami/kafka:3.6
    container_name: seckill-kafka
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@seckill-kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:30103
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    ports:
      - "30103:9092"
    depends_on:
      postgres:
        condition: service_healthy
