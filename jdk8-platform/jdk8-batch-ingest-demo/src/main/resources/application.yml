server:
  port: 8084

spring:
  application:
    name: batch-ingest-demo

  # ======== Redis 配置（Lettuce 连接池）========
  redis:
    host: localhost
    # 与 seckill-demo 共用同一 Redis 实例（本机 30102）
    port: 30102
    password: ${REDIS_PASSWORD:redis123}
    database: 0
    timeout: 6000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 4

# ======== 批量入库引擎配置 ========
batchingest:
  # 默认实现：adaptive | static | legacy
  mode: adaptive
  # Redis 写入 Hash 的 key 前缀（压测会对同一个 key 追加数据）
  key-prefix: batch:demo
  # ===== 自适应引擎参数 =====
  # 内存桶（ArrayBlockingQueue）容量上限
  queue-capacity: 2000000
  # 加速线程启用/停用的临界水位（队列中的条目数超过即启用第二消费线程削峰）
  queue-critical: 200000
  # 初始批量大小
  batch-initial: 2048
  # 批量收敛上下界
  batch-min: 128
  batch-max: 20480
  # 探索概率（满量 flush 时以该概率随机试探一个候选批量）
  explore-prob: 0.2
  # 静默兜底 flush 间隔（毫秒，低流量时避免长时间滞留）
  idle-flush-ms: 8000
  # 速度反馈的指数衰减因子（按秒衰减）
  decay-factor: 0.9
  # 平滑过渡：新值 = 当前×smooth + 最优×(1-smooth)
  smooth-current-weight: 0.3
  # 每 N 次 flush 调整一次批量大小
  sample-window: 100
  # 是否启用加速线程（突发削峰）
  use-accelerator: true

  # ===== 压测参数（启动时 --batchingest.bench.enabled=true 触发）=====
  bench:
    enabled: false
    mode: adaptive
    threads: 8
    # 目标汇聚速率（条/秒）；flood=true 时忽略
    rate: 5000
    duration-sec: 15
    flood: false

# ======== 日志配置 ========
logging:
  level:
    lan.chaos.batchwriter: INFO