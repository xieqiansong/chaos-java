# 本地 demo 配置（指向本机 MySQL 容器，端口 30100）
flink.ck-path=file:///tmp/flink-cdc-sync/checkpoints

source.server.address=127.0.0.1
source.server.port=30100
source.server.database=demo
source.server.username=root
source.server.password=<YOUR_PASSWORD>
# 服务端数据时区（Flink CDC serverTimeZone 要时区名，不是数字）。
# 本地 MySQL 解析为 UTC（偏移0），必须填 UTC，填 0 会被 JDBC 驱动拒绝。
source.server.timezone=UTC
source.server.server-id=1100

flink.executer.profile=test
