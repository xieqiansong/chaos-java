spring:
  application:
    name: ms-gateway
  cloud:
    nacos:
      config:
        # P6 Nacos Config：配置外置到 Nacos，支持多环境（namespace）+ 动态刷新（@RefreshScope）
        server-addr: ${NACOS_ADDR:localhost:8848}
        # Data ID 规则：默认读 ${spring.application.name}.${file-extension}（即 ms-gateway.yaml），
        # 以及带 profile 的 ${spring.application.name}-${profile}.yaml
        file-extension: yaml
        # 多环境：namespace 用空间 ID（在 Nacos 控制台创建 dev/test/prod 后拿到）。
        # 留空 = public 空间（本地没有 Nacos 时即走这里，配合下方 fail-fast=false 用本地默认配置启动）
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:MICROSERVICE_GROUP}
        refresh-enabled: true
        # 连不上 Nacos 是否直接启动失败。默认 false：连不上就用本地 application*.yml 的默认值继续跑，
        # 这保证“没有 Nacos 也能本地启动”；生产联调时建议改 true，避免配置没拉到却“静默空配置”上线。
        fail-fast: false
  # SCA 2021 起 Nacos Config 走 spring.config.import 机制：必须声明从哪个 DataId 拉取。
  # optional: 前缀表示“连不上 Nacos 就跳过”，保证本地无 Nacos 也能启动（用本地默认配置）。
  config:
    import: optional:nacos:${spring.application.name}.yaml
