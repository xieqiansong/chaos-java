spring:
  application:
    name: ms-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: ms-user-route
          uri: lb://ms-user
          predicates:
            - Path=/users/**
        - id: ms-order-route
          uri: lb://ms-order
          predicates:
            - Path=/orders/**
    sentinel:
      enabled: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: 8719
  config:
    import: classpath:application-common.yml

server:
  port: 8080
