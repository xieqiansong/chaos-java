spring:
  datasource:
    # H2 内存库，MODE=MySQL 让语法尽量兼容；CASE_INSENSITIVE_IDENTIFIERS 避免列名大小写歧义
    url: jdbc:h2:mem:mpdemo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
    # DB_CLOSE_DELAY=-1：H2 内存库在最后一个连接关闭后不丢弃数据，
    # 保证 SchemaInit 初始化后、业务 Mapper 取到的连接仍看得到表。

  # 启动时执行 db/schema.sql + db/data.sql 建表/插数（H2 内存库每次 JVM 重建，必须重建表）
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 打印 SQL，便于观察各插件（分页/租户/动态表名/逻辑删除）实际生成的语句
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除全局配置：deleted 字段 0=未删 1=已删
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
